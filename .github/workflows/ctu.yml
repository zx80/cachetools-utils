name: CacheTools Utils Package

on:
  push:
    branches: [ "main" ]
  # push_request: ?

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        # - version: "pypy3.10"
        #   deps: doc,dev,tests,crypt
        - version: "pypy3.11"
        - version: "3.11"
        - version: "3.12"
        - version: "3.13"
        # 2025-03-07 KO crypt => cryptography
        # 2026-11-10 KO maturin rustc pyo3 failure on ast-serialize
        # - version: "3.13t"
        #   gil: 0
        # - version: "3.13t"
        #   gil: 1
        # Python 3.14
        - version: "3.14"
        - version: "3.14t"
          gil: 0
        - version: "3.14t"
          gil: 1
        # Python 3.15
        - version: "3.15"
        - version: "3.15t"
          gil: 0
        - version: "3.15t"
          gil: 1
    env:
      PYTHON_GIL: ${{ matrix.python.gil }}
    steps:
    # Setup
    - name: Checkout Project
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python.version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python.version }}
        allow-prereleases: true
        cache: "pip"
    # Dependencies
    - name: Install Python dependencies and module
      run: make DEPS=doc,dev,tests,crypt dev
    - name: Start Redis
      uses: supercharge/redis-github-action@1.8.1
    - name: Start MemCached
      uses: niden/actions-memcached@v8
    # Checks
    # - name: Check with black
    #  run: black --check CacheToolsUtils.py
    - name: Check with flake8
      run: make check.flake8
    - name: Check the docs
      run: make check.docs
    - name: Check with pytest
      run: make check.pytest
    - name: Check with coverage
      run: make check.coverage
    - name: Check with pyright
      run: make check.pyright
    # 2025-03-07: KO with 3.13t because types-redis requires cryptography
    # - name: Check with mypy
    #   # mypy is much too slow, this is a pain:-/
    #   run: make check.mypy
